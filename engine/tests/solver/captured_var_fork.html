<!doctype html>
<meta charset="utf-8">
<title>captured var across a fork</title>
<script>
/* ONE PROBLEM: a captured `var` assigned AFTER a concolic fork is read back as its PRE-ASSIGNMENT value on the
 * forced sibling. The engine invents a throw a real browser does not make — a minified bundle calling a
 * function it assigned earlier in the same flat `var` chain dies with `<name> is not a function (it is
 * undefined)`, taking every endpoint behind that script with it.
 *
 * WHY THIS DOCUMENT AND NOT A PROBE OF THE FINDING COUNT. The two halves of `w = v = function(){}` are ONE
 * assignment expression over TWO storages: `v` is CAPTURED (a closure reads it) so every access is a JSVarRef
 * cell, and `w` is not, so it is a plain slot in the frame's own buffer. Reporting both `typeof`s in one URL
 * makes the loss a CONSERVATION IDENTITY a reader can check without knowing anything about the engine: the
 * statement either ran or it did not, so `plain-function` beside `closure-undefined` is not a small number, it
 * is a contradiction. The third field reads the same cell from the FRAME instead of from the CLOSURE, which
 * says whether the two READERS disagree or the CELL itself is wrong. They agree; the cell is wrong.
 *
 * WHAT WAS MEASURED, AND AT WHAT STRENGTH. Driven with `solvergate.mjs --run <this> <sched>` against the
 * artifact then in engine/host/out (built at superproject f49e7bf6, submodule state unrecorded), so these are
 * numbers about that artifact and not about a revision anyone can rebuild.
 *   - THIS SHAPE, 9 runs (6 `direct`, 2 `preempt`, 1 `eager`): the wrong value in 7 of 9.
 *   - The same document with the uncaptured witness `w` removed, 3 runs: 2 of 3.
 *   - THE CONTROL, 3 runs, 0 of 3 — the identical fork over a cell whose owning frame has already RETURNED, so
 *     the cell is DETACHED and its storage is the heap rather than a frame slot. Same unknown, same depth,
 *     same assignment shape. It is NOT in this document because putting it here SUPPRESSES the defect (5 runs,
 *     0 of 5): a second IIFE is a second unknown and a bigger frontier, and it moves the interleaving. That
 *     sensitivity is a fact about the defect, not a flaw in the control.
 * WHAT REPRODUCED, AND WHAT DOES NOW. THE PARAGRAPH THAT STOOD HERE IS REWRITTEN RATHER THAN DELETED, because
 * a reader who meets a run that is clean on arm1 will otherwise re-derive its rule and read the defect as gone.
 * IT READ: "The COUNT of wrong arms per run varies and some runs are clean, so no count here is a measurement
 * of anything. What does not vary is the IDENTITY of the wrong answer: it is always the PRE-ASSIGNMENT value,
 * always on the FORCED sibling (arm2), and always beside `plain-function`." Of its three claims the
 * PRE-ASSIGNMENT-VALUE one held and the other two are now false.
 * MEASURED BY A COORDINATOR, not by the lane that wrote this paragraph: tree revision a5e62f6f, against the
 * artifact in extension/lib/qjs stamped 85cb7ea5 with `dirty: []` — which is the artifact
 * `solvergate.mjs --run` loads, since renderer_abi.mjs's GLUE_PATH names it. Five schedules (`direct`,
 * `preempt`, `eager`, `park`, `lastreply`), one run each, two learned addresses per run, BYTE-IDENTICAL across
 * all five: `closure-undefined/frame-undefined/plain-function` on arm1 AND on arm2, ten arms of ten.
 * So the defect is BROADER — the arm the old signature called correct is wrong too — and DETERMINISTIC, where
 * the old one was 7 of 9 and moved with the interleaving. A clean run is still not evidence the defect is gone;
 * and a run wrong on arm2 ALONE is now itself evidence of a CHANGE, because that is the OLD signature.
 * WHAT THE ARM FIELD DOES AND DOES NOT WITNESS, since the shape above invites reading it wrongly: `b` is an
 * UNCAPTURED local, so `arm1`/`arm2` differing across the two addresses witnesses that the FORK happened and
 * that each arm ran its own branch. It does NOT witness that the `arm` CELL is isolated — the value was copied
 * out into `b` in the same expression that produced it, before anything could switch — so it is not a second
 * working captured binding standing beside the broken one, and must not be read as narrowing the defect to `v`.
 *
 * WHAT IT NAMES. What fails is not "a cell across a fork" but an OPEN cell, whose `pvalue` is a slot in the
 * frame that MINTED it — and which clone_susp_frame / clone_deep_flow share with the sibling (+1 ref) while
 * giving the sibling its own copied buffer. The COW delta isolates the CELL; it does not isolate the FRAME
 * SLOT the cell points into, and a frame is flow-private. The delta is not the loser here and the framing
 * that blames it is wrong: cow_capture_varref keys its entry on the CELL POINTER, so after a fork both
 * flows' deltas name the same cell and the swap is self-consistent about it. What is lost is that the
 * ISOLATION unit (the cell) and the STORAGE unit (`pvalue`, a slot in the SOURCE flow's buffer) are two
 * different objects, while the clone's own copied slot at that index is dead.
 * FIXED by close_var_refs_for_fork, which detaches a frame's own open cells before either clone path
 * shares them: a detached cell IS its storage, so both arrays naming it agree and ONE delta entry covers
 * the whole binding — which is the configuration /q/ below had already measured clean.
 * THAT `FIXED` SENTENCE IS RETIRED BY MEASUREMENT AND REWRITTEN RATHER THAN DELETED, because it is the
 * reading a reader re-derives from the detach: it predicts this document is CLEAN, and this document is not.
 * It also predicted the detached-cell control would be clean, which is true — so it is right about the
 * control and wrong about the case the control was built to explain, which is the shape that kept it alive.
 * MEASURED BY A COORDINATOR, artifact stamped 17fc107d `dirty: []`, schedule `direct`, three runs of each
 * document in one session with this one re-run beside them as a paired positive control. Four documents, and
 * the only variable that predicts the answer is the WRITE PATH:
 *   LIVE minting frame, write DIRECT, one closure over `v`   (this document)              closure-undefined
 *   LIVE minting frame, write DIRECT, two closures over `v`  (captured_var_two_closures)  closure-undefined
 *   LIVE minting frame, write via a DEEPER frame             (captured_var_live_deep_write) closure-function
 *   RETURNED minting frame, write via a closure call         (captured_var_detached_control) closure-function
 * So it is NOT the cell's storage, NOT detachment, and NOT how many closures capture it. The two-closure
 * document exists only to kill that last confound and it killed it: two closures with a DIRECT write still
 * lose. What survives is narrow and is a statement about an OPCODE rather than about a delta — a write
 * issued DIRECTLY from the frame that minted the cell loses across a fork, and the SAME cell of the SAME
 * live frame written from one frame deeper does not.
 * WHAT THAT DOES NOT ESTABLISH, stated because the matrix invites over-reading: it names the discriminator
 * and not the mechanism. It does not say which opcode, does not say whether the loss is at the write or at
 * the read, and every row is one artifact and one schedule. The control's own banner records that an
 * AGREEMENT between two of these is unambiguous and a DIFFERENCE has candidate causes — the reason there
 * are four documents and not two is that each difference cost another one to disambiguate.
 *
 * WHAT IT ASKS OF THE GATE. Every arm assigns before it reads, so `typeof` is `"function"` in every world this
 * program has; there is no schedule under which `undefined` is an answer. It is therefore also a
 * schedule-invariance failure in solvergate's own terms — the finding set stops being a function of the
 * document. It FAILED until close_var_refs_for_fork gave a forked sibling's captured local storage of its
 * own; it is a REGRESSION test now, and a `closure-undefined` here means that detach has stopped happening.
 * AND THE ENFORCEMENT THAT SENTENCE NAMES IS THE ONE THE DEFECT SWITCHED OFF, WHICH IS HOW IT SURVIVED. The
 * gate's ONLY oracle is that the finding SET is equal ACROSS SCHEDULES — its own banner: "It fails only when
 * ONE BUILD DISAGREES WITH ITSELF" — and it deliberately stores no per-document expected output, because
 * CLAUDE.md bans one twice over. An INTERMITTENT wrong answer makes two schedules disagree and the gate speaks;
 * a TOTAL one makes every schedule agree, so the finding set IS a function of the document and the gate reports
 * `ok`. The word "also" above is the tell: the invariance failure was always a CONSEQUENCE of this defect being
 * flaky and never a check on its IDENTITY, so the defect getting WORSE is what blinded its own regression test.
 * Nor can that be repaired inside this document. The conservation identity it is built around —
 * `plain-function` beside `closure-undefined` is a CONTRADICTION — is stated here in prose and asserted by
 * NOTHING, and no channel the gate compares can carry it: a uniform violation is schedule-invariant in
 * `pageErrors` exactly as it is in the addresses, so a self-check that threw would be compared equal too.
 * The identity is a fact about the ENGINE (a captured binding has ONE storage), so by this project's own rule
 * it belongs as a DCHECK at its origin and not as a fixture self-check — see get_captured_cell, where the
 * assert for exactly this state was deleted when the fork learned to detach, and has been put back.
 * A captured ARGUMENT used to be the arm this did NOT cover — addressed both through its cell and directly
 * through arg_buf, so detaching was not semantics-neutral there and that arm DFAILed. It is covered now: the
 * argument opcodes ask the same `is_captured` the compiler reads, and the fused index-in-opcode short forms
 * are refused for a captured parameter at the one point every short-form emission passes through. This
 * document's bindings are all `var` locals and d(n)'s parameter is not captured, so it still exercises the
 * DETACH arm only — the argument arm's own reproducer is a four-line document, and §10.4.4's aliasing (a
 * mapped `arguments` and its parameter reading and writing one storage, in both directions) is a separate
 * fixture. A `closure-undefined` here still means the detach stopped happening.
 *
 * THE DEPTH IS NOT THE MECHANISM. This reproduces with TWO flows. The real bundle needed roughly 39k only
 * because a larger frontier makes the interleaving that loses the write near-certain, which is the same
 * sensitivity the control paragraph above measures from the other side. */
(function () {
  var v = undefined, w = undefined, arm = 0;
  function rd() { return v; }
  /* `arm` is a captured local of THIS frame written from a DEEPER frame, so the branch that forks is on the
     tramp chain with this frame beneath it and clone_deep_flow clones this frame. */
  function d(n) { if (n > 0) return d(n - 1); if (__FLAGS.b) { arm = 1; } else { arm = 2; } return arm; }
  var b = d(3), assigned = (w = v = function () { return 1; }), pad = 0;
  fetch("/p/closure-" + (typeof rd()) + "/frame-" + (typeof v) + "/plain-" + (typeof w) + "/arm" + b);
})();
</script>
