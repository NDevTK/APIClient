<!doctype html>
<meta charset="utf-8">
<title>reply values</title>
<script>
/* ONE PROBLEM: the reply path — the flow parks on a request only the trusted host can make, the host answers,
 * and the continuation resumes WITH the settled value and builds a second endpoint out of a field of it.
 * CLAUDE.md §Learning-from-replies calls a consumed reply the richest source of real example values, so
 * `/api/region/us-east-1/items` is a value the run COMPUTED and not one anybody wrote down.
 *
 * WHAT MAKES IT A SCHEDULE-INVARIANCE DOCUMENT: two `.then` reactions, each a first-class flow on the one
 * WFQ, and a park in the middle. The `lastreply` schedule answers the owed request at a different step from
 * the `direct` one and the `park` schedule answers it in a different SESSION; the second endpoint must be
 * identical in all three, because the reply is the same reply whenever it lands. */
fetch("/config.json").then(function (r) {
  return r.json();
}).then(function (cfg) {
  fetch("/api/region/" + cfg.region + "/items");
});
</script>
