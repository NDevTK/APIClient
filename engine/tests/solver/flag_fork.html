<!doctype html>
<meta charset="utf-8">
<title>flag fork</title>
<script>
/* ONE PROBLEM: a server-injected flag the logged-out visitor does not have.
 *
 * `__FLAGS` resolves nowhere and is not a Web IDL name, so solver/absent.c answers it as unknown INPUT rather
 * than as `undefined` — CLAUDE.md §Attacker-sources: absent app-state is unknown injected input, so the auth
 * gate FORKS to the logged-in arm instead of burying the admin code behind a concrete `undefined`.
 *
 * WHAT MAKES IT A SCHEDULE-INVARIANCE DOCUMENT: the two arms are two flows, one of them a snapshot-forked
 * sibling that REPLAYS its recorded arm. Both fetch, so both park on a reply, so which one resumes first is
 * entirely the schedule's choice — and both endpoints must be in the answer whichever way it chose. */
if (__FLAGS.admin) {
  fetch("/api/admin/users");
} else {
  fetch("/api/public/users");
}
</script>
