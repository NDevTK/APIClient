# Scheduled detection of new quickjs-ng upstream commits — so the fork is never
# silently stale and nobody has to poll by hand. Cheap (no build): it only diffs
# git history. When behind, the run FAILS (red ✗ + owner email) with the exact
# remediation. The actual sync is deliberately NOT automated here — it needs the
# emsdk/Z3 build + the live-Chrome gate suite + judgement (see engine/sync.mjs):
#   node engine/sync.mjs apply   then verify (full gates + _idxdocs) and land.
name: quickjs-upstream-check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}   # also runnable on demand

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: How far is apiclient-fork behind quickjs-ng upstream?
        run: |
          set -euo pipefail
          git clone --no-checkout --filter=blob:none https://github.com/NDevTK/APIClient-quickjs fork
          cd fork
          git remote add upstream https://github.com/quickjs-ng/quickjs
          git fetch --quiet --tags origin apiclient-fork
          git fetch --quiet --tags upstream master
          base=$(git merge-base origin/apiclient-fork upstream/master)
          behind=$(git rev-list --count "$base"..upstream/master)
          uptag=$(git describe --tags upstream/master 2>/dev/null || echo "unknown")
          echo "quickjs-ng upstream: $uptag"
          echo "apiclient-fork is $behind upstream commit(s) behind."
          if [ "$behind" -gt 0 ]; then
            echo "::warning title=quickjs-ng upstream behind::$behind commit(s) behind ($uptag). Run 'node engine/sync.mjs apply', verify the full gate set + _idxdocs, then land."
            exit 1
          fi
          echo "Up to date."
