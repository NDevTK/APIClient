<!DOCTYPE html>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https: http: data:">
<!-- The offscreen document hosts the API-learning BRAIN (offscreen-brain.js, the
     former service worker) where it has a stable lifetime + IndexedDB. Its lib/*
     dependencies load first (same set the SW used to importScripts), then the
     brain, then ast-worker.js which owns the analysis Web Worker and exposes
     self.astDispatch for the brain to call directly. -->
<script src="lib/protobuf.js"></script>
<script src="lib/discovery.js"></script>
<script src="lib/req2proto.js"></script>
<script src="lib/stats.js"></script>
<script src="lib/chains.js"></script>
<script src="lib/trace-mapping.bundle.js"></script>
<!-- Picker heuristics (ORDER only, never COVERAGE) — loaded before the brain
     so its review-queue drain can use them. Same file the analysis Worker
     loads via importScripts; both contexts share self._priorityCmp. -->
<script src="lib/priority.js"></script>
<!-- THE single external-fetch function (GET only, no cookies, http(s) only).
     Shared with the analysis Worker (ast-thread.js importScripts). -->
<script src="lib/safe-fetch.js"></script>
<script src="offscreen-brain.js"></script>
<!-- v2 host bridge: ES6 module (imports the wasm factory lib/qjs/qjs.mjs), installs self.astDispatch. -->
<script type="module" src="ast-worker.js"></script>
