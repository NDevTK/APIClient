<!DOCTYPE html>
<!-- `frame-src 'self'` IS WHAT LETS THIS DOCUMENT HOLD A RENDERER, and its absence was a block with no
     symptom on this side: the manifest's extension_pages policy grants `frame-src 'self'`, but policies
     COMBINE and every one must allow, and this document's own policy names no frame-src at all — so it fell
     back to `default-src 'none'` and every renderer frame renderer-host.js creates would have been refused by
     the strictest of the two. It is 'self' and nothing wider: the only address this zone ever frames is
     renderer.html, on this origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; frame-src 'self'; connect-src 'self' https: http: data:">
<!-- The offscreen document hosts the API-learning BRAIN (offscreen-brain.js, the
     former service worker) where it has a stable lifetime + IndexedDB. Its lib/*
     dependencies load first, then the brain — which now ALSO contains the v2 host
     bridge (merged from the deleted ast-worker.js): it dynamic-import()s the engine
     WASM and installs self.astDispatch. One trusted file, no split. -->
<!-- DCHECK/CHECK: the JS mirror of engine/host/check.h, loaded FIRST so every component can fail hard on a
     violated invariant (dev) exactly like the C engine — the confidence + isolation-testability substrate. -->
<script src="check.js"></script>
<script src="lib/protobuf.js"></script>
<script src="lib/protocol-parsers.js"></script>
<script src="lib/discovery.js"></script>
<script src="lib/openapi-import.js"></script>
<script src="lib/openapi-export.js"></script>
<script src="lib/stats.js"></script>
<script src="lib/chains.js"></script>
<!-- THE BROWSER PROCESS's trusted side: provisions extension/browser-process.js as a dedicated module Worker
     (its own realm, its own WASM instance, its own thread — no HEAPU8 shared with this document) and relays
     the decisions §7 backs to it — CORB for a script load, and what a captured reply IS FOR. Loaded BEFORE
     both of its shipped callers, safe-fetch.js and lib/response-decode.js. `worker-src 'self'` in this
     document's own policy above is what lets the Worker exist at all: policies COMBINE, so the manifest's
     grant is not enough on its own. -->
<script src="browser-process-host.js"></script>
<!-- THE single external-fetch function (GET only, no cookies, http(s) only). -->

<script src="lib/safe-fetch.js"></script>
<script src="lib/schema.js"></script>
<script src="lib/keys.js"></script>
<script src="lib/persistence.js"></script>
<script src="lib/grouping.js"></script>
<!-- lib/discovery-probe.js is GONE: fetching an API's published description is the ENGINE's active discovery
     (engine/host/solver/discovery.c), which seeds a FLOW per candidate address on the one frontier. -->
<script src="lib/learn.js"></script>
<script src="lib/response-decode.js"></script>
<script src="lib/encode.js"></script>
<script src="lib/merge.js"></script>
<script src="lib/send.js"></script>
<script src="lib/popup-handlers.js"></script>
<script src="lib/serialize.js"></script>
<!-- the analysis brain (LOGIC — being deleted into the engine over time). -->
<script src="offscreen-brain.js"></script>
<!-- the trusted side of a RENDERER FRAME: provisions renderer.html in a sandboxed (opaque-origin) iframe,
     hands it the engine program, and relays the qjs_* ABI to it. This is where the WASM load moves to, so it
     is loaded before the bridge that will call it. -->
<script src="renderer-host.js"></script>
<!-- the v2 host bridge: the ONLY irreducible trusted-zone JS (SECURITY.md) — dynamic-import()s the
     engine WASM lib/qjs/qjs.mjs, drives qjs_step, safe-fetches, persists IDB, installs self.astDispatch. -->
<script src="bridge.js"></script>
