<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PoC sandbox</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
  #wrap { padding: 8px; }
  .hdr { font-size: 10px; text-transform: uppercase; letter-spacing: .4px;
    color: #8b949e; margin-bottom: 4px; }
  .hdr .origin { color: #6e7681; text-transform: none; letter-spacing: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  button { background: #238636; color: #fff; border: 0; border-radius: 4px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; }
  button:disabled { background: #21262d; color: #6e7681; cursor: default; }
  #status { font-size: 11px; color: #8b949e; }
  #status.ok { color: #6fd98a; }
  #status.err { color: #ff8181; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hdr">attacker sandbox <span class="origin">(null opaque origin — genuinely cross-origin to the target; normal web rules apply)</span></div>
  <div class="row">
    <button id="run" disabled>▶ Run PoC</button>
    <span id="status">waiting for PoC…</span>
  </div>
</div>
<script>
// Sandboxed extension page (manifest `sandbox.pages`): unique opaque origin,
// no chrome.* access, eval allowed. It runs the EXACT PoC JavaScript the popup
// hands it — the same artifact a researcher would paste on https://example.com.
// Running on the USER'S click provides real user activation, so the PoC's
// window.open() is not popup-blocked (no `debugger` permission needed to fake a
// gesture). X-Frame-Options / activation rules apply exactly as on a real page.
(function () {
  var pocJs = null, marker = null;
  var runBtn = document.getElementById("run");
  var statusEl = document.getElementById("status");
  var parentWin = null, parentOrigin = "*";

  // The PoC JavaScript is displayed by the popup (once) — this embed only RUNS
  // it. We receive the exact code via POC_SETUP and eval it on the user's click.
  window.addEventListener("message", function (e) {
    if (window.origin !== 'null') return console.error('Not sandboxed');
    // WHY A PREFIX IS ENOUGH HERE, AND WHAT WOULD MAKE IT NOT BE. A sandboxed page has no chrome.* at all, so
    // it cannot learn its own extension id to compare exactly — the prefix plus `e.source === window.top` is
    // the whole of what it can check. That is sufficient ONLY because this file is in no
    // `web_accessible_resources` entry: nothing outside this extension can frame or open it, so the only
    // document that can ever be its top is one of ours. Adding it to web_accessible_resources makes the prefix
    // a hole (any other extension's page could embed it and hand it a PoC to run) — at that point the embedder
    // must state the expected origin in the frame URL and this check must compare it exactly.
    if (!e.origin.startsWith('chrome-extension:') || e.source !== window.top) return console.error('Untrusted sender');
    var d = e.data;
    if (!d || d.type !== "POC_SETUP") return;
    pocJs = String(d.pocJs || "");
    marker = d.marker || null;
    runBtn.disabled = !pocJs;
    parentWin = e.source; parentOrigin = e.origin || "*";
    statusEl.className = ""; statusEl.textContent = "ready — click Run";
  });

  // WHETHER A DOCUMENT WAS EVER HANDED THE PAYLOAD IS THIS FILE'S TO SAY, AND NOTHING DOWNSTREAM CAN SAY IT.
  // §LIVE-VERIFY reads NO HIT as an ENGINE-FIDELITY DIVERGENCE TO FIX, which is only true of a payload that
  // actually reached a document. This handler used to discard the delivery's own answer and post `error:null`
  // for every run that did not THROW, so three states arrived at the popup as one and the popup printed the
  // strongest of them: a delivery that ran and did not fire (a real divergence), a delivery that created NO
  // NAVIGABLE AT ALL, and a delivery whose result this file cannot state, all read as "payload delivered" and
  // then as "the engine's model diverges from Chrome here (an engine-fidelity bug to investigate)" — a
  // confident wrong instruction about a navigation that never happened, and CLAUDE.md §@S's named tell
  // (a rung whose ABSENCE and whose ZERO read alike) performed on the verify surface.
  //
  // THE ANSWER IS THE PLATFORM'S OWN AND IT IS ALREADY IN HAND. HTML §7.2.2.1 "Opening and closing windows"
  // defines the window open steps to end either "If targetNavigable is null, then return null" (step 14 — the
  // user agent created no navigable, which is what a popup blocker is) or "Return targetNavigable's active
  // WindowProxy" (step 19). The delivery this layer performs is one `window.open(...)` expression statement
  // (offscreen-brain.js `buildLiveDelivery`, the `address` arm), so the completion value of `pocJs` IS that
  // return value — which is why it is READ here rather than re-derived from anything.
  //
  // AND THE THIRD TOKEN IS THE HONEST ONE. `undefined` is not a delivery outcome: it is this file's statement
  // that the pocJs it was handed is no longer an expression whose value says what happened. It crosses as
  // `unstated` rather than being folded into either real answer, so a delivery arm that grows a second
  // statement shows up as a NAMED contract gap on the card instead of as an engine bug. HOW ITS ABSENCE WOULD
  // SHOW, had this stayed unstated: every popup-blocked verify reporting the engine as wrong.
  runBtn.addEventListener("click", function () {
    if (!pocJs) return;
    statusEl.className = ""; statusEl.textContent = "running…";
    var threw = null, opened;
    try { opened = (0, eval)(pocJs); }   // user gesture present → window.open allowed
    catch (err) { threw = (err && err.message) || String(err); }
    // Identity comparisons ONLY: a successful open answers a CROSS-ORIGIN WindowProxy, whose members are
    // HTML §7.2.1's fixed cross-origin list and whose anything-else is a SecurityError — so the value is
    // classified by what it IS and never by reading it.
    var outcome = threw !== null    ? "threw"
                : opened === undefined ? "unstated"
                : opened === null      ? "no-navigable"
                                       : "delivered";
    if (outcome === "threw") {
      statusEl.className = "err"; statusEl.textContent = "PoC threw before any navigation: " + threw;
    } else if (outcome === "no-navigable") {
      statusEl.className = "err";
      statusEl.textContent = "no window was created — the payload was never delivered (allow popups for this extension)";
    } else if (outcome === "unstated") {
      statusEl.className = "err";
      statusEl.textContent = "the delivery did not state what it produced — see the card";
    } else {
      statusEl.className = "ok"; statusEl.textContent = "PoC delivered — verdict updates below when the sink fires";
    }
    // NO `catch (_) {}` AROUND THE HANDOFF, for the reason lib/popup-security.js gives for dropping its own:
    // this posts a plain object to the document that handed us the PoC and whose origin came off that very
    // message, so the only way it throws is a bug in that pairing — and swallowing it left the popup showing
    // "click Run PoC" for ever, which reads as a verify the user never started rather than as one that broke.
    (parentWin || parent).postMessage({ type: "POC_RAN", marker: marker, error: threw, outcome: outcome },
                                      parentOrigin);
  });

  // Tell the popup we're ready to receive the PoC.
  try { parent.postMessage({ type: "POC_READY" }, "*"); } catch (_) {}
})();
</script>
</body>
</html>
