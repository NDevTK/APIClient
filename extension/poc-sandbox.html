<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PoC sandbox</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
  #wrap { padding: 8px; }
  .hdr { font-size: 10px; text-transform: uppercase; letter-spacing: .4px;
    color: #8b949e; margin-bottom: 4px; }
  .hdr .origin { color: #6e7681; text-transform: none; letter-spacing: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  button { background: #238636; color: #fff; border: 0; border-radius: 4px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; }
  button:disabled { background: #21262d; color: #6e7681; cursor: default; }
  #status { font-size: 11px; color: #8b949e; }
  #status.ok { color: #6fd98a; }
  #status.err { color: #ff8181; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hdr">attacker sandbox <span class="origin">(null opaque origin — genuinely cross-origin to the target; normal web rules apply)</span></div>
  <div class="row">
    <button id="run" disabled>▶ Run PoC</button>
    <span id="status">waiting for PoC…</span>
  </div>
</div>
<script>
// Sandboxed extension page (manifest `sandbox.pages`): unique opaque origin,
// no chrome.* access, eval allowed. It runs the EXACT PoC JavaScript the popup
// hands it — the same artifact a researcher would paste on https://example.com.
// Running on the USER'S click provides real user activation, so the PoC's
// window.open() is not popup-blocked (no `debugger` permission needed to fake a
// gesture). X-Frame-Options / activation rules apply exactly as on a real page.
(function () {
  var pocJs = null, marker = null;
  var runBtn = document.getElementById("run");
  var statusEl = document.getElementById("status");
  var parentWin = null, parentOrigin = "*";

  // The PoC JavaScript is displayed by the popup (once) — this embed only RUNS
  // it. We receive the exact code via POC_SETUP and eval it on the user's click.
  window.addEventListener("message", function (e) {
    if (window.origin !== 'null') return console.error('Not sandboxed');
    // WHY A PREFIX IS ENOUGH HERE, AND WHAT WOULD MAKE IT NOT BE. A sandboxed page has no chrome.* at all, so
    // it cannot learn its own extension id to compare exactly — the prefix plus `e.source === window.top` is
    // the whole of what it can check. That is sufficient ONLY because this file is in no
    // `web_accessible_resources` entry: nothing outside this extension can frame or open it, so the only
    // document that can ever be its top is one of ours. Adding it to web_accessible_resources makes the prefix
    // a hole (any other extension's page could embed it and hand it a PoC to run) — at that point the embedder
    // must state the expected origin in the frame URL and this check must compare it exactly.
    if (!e.origin.startsWith('chrome-extension:') || e.source !== window.top) return console.error('Untrusted sender');
    var d = e.data;
    if (!d || d.type !== "POC_SETUP") return;
    pocJs = String(d.pocJs || "");
    marker = d.marker || null;
    runBtn.disabled = !pocJs;
    parentWin = e.source; parentOrigin = e.origin || "*";
    statusEl.className = ""; statusEl.textContent = "ready — click Run";
  });

  // WHETHER A DOCUMENT WAS EVER HANDED THE PAYLOAD IS *NOT* THIS FILE'S TO SAY, AND THE PARAGRAPH THAT STOOD
  // HERE SAID THE OPPOSITE. It is kept in its own words because it is the reading a reader re-derives from the
  // fact that the delivery is ONE expression statement: "THE ANSWER IS THE PLATFORM'S OWN AND IT IS ALREADY IN
  // HAND. HTML §7.2.2.1 'Opening and closing windows' defines the window open steps to end either 'If
  // targetNavigable is null, then return null' (step 14 — the user agent created no navigable, which is what a
  // popup blocker is) or 'Return targetNavigable's active WindowProxy' (step 19). The delivery this layer
  // performs is one `window.open(...)` expression statement, so the completion value of `pocJs` IS that return
  // value — which is why it is READ here rather than re-derived from anything."
  //
  // BOTH QUOTATIONS ARE VERBATIM AND THE ENUMERATION IS SHORT, which is the whole defect. The window open
  // steps have NINETEEN top-level steps and FOUR `return null` arms: step 1 (the event loop's termination
  // nesting level is nonzero), step 14, step 17 ("If windowType is 'new with no opener', then return null")
  // and step 18 ("If noopener is true and target is not an ASCII case-insensitive match for '_self',
  // '_parent', or '_top', then return null"). The navigate is step 15. So steps 17 and 18 answer null for a
  // document that HAS been navigated, and only step 14 means no navigable was created.
  //
  // AND STEP 17 IS REACHED BY THIS FILE'S OWN SHAPE, NOT BY AN EXOTIC ONE. HTML §7.3.1.7 "Navigable target
  // names"' rules for choosing a navigable: "If currentDocument's opener policy's value is 'same-origin' or
  // 'same-origin-plus-COEP', and currentDocument's origin is not same origin with currentDocument's relevant
  // settings object's top-level origin: Set noopener to true. Set name to '_blank'. Set windowType to 'new
  // with no opener'." This page is a `manifest.sandbox.pages` document, so its origin is OPAQUE and the SECOND
  // conjunct holds at every COOP value the extension can ship; the first is the manifest's
  // `cross_origin_opener_policy`. At `same-origin-allow-popups` the clause does not fire. At `same-origin` it
  // fires for EVERY delivery — the document loads and runs, and this expression answers null.
  //
  // SO THE HANDLE IS REPORTED AND GATES NOTHING. What crosses is what this file can soundly state and nothing
  // else: whether the evaluation THREW (only this frame can see that), and which of the three shapes the
  // completion value had — read by IDENTITY only, since a successful open answers a CROSS-ORIGIN WindowProxy
  // whose members are HTML §7.2.1's fixed cross-origin list and whose anything-else is a SecurityError. The
  // DELIVERY verdict is decided in the trusted zone from the browser's own facts, off a document announcing
  // itself at the delivered address (offscreen-brain.js `_recordProbeDelivery`).
  //
  // `handle: "none"` IS STILL THE HONEST THIRD TOKEN and keeps its own reason. `undefined` is not a shape the
  // window open steps can return: it is this file's statement that the pocJs it was handed is no longer an
  // expression whose value says anything, so it names a CONTRACT GAP in offscreen-brain.js's
  // `buildLiveDelivery` — a delivery arm that grew a second statement. It no longer decides delivery, because
  // a second statement in the delivery says nothing about whether a document received the payload.
  runBtn.addEventListener("click", function () {
    if (!pocJs) return;
    statusEl.className = ""; statusEl.textContent = "running…";
    var threw = null, opened;
    try { opened = (0, eval)(pocJs); }   // user gesture present → window.open allowed
    catch (err) { threw = (err && err.message) || String(err); }
    var handle = opened === undefined ? "none" : opened === null ? "null" : "window";
    if (threw !== null) {
      statusEl.className = "err"; statusEl.textContent = "the delivery threw before it completed: " + threw;
    } else {
      statusEl.className = "ok";
      statusEl.textContent = "delivery ran — the panel reports below whether a document received it";
    }
    // NO `catch (_) {}` AROUND THE HANDOFF, for the reason lib/popup-security.js gives for dropping its own:
    // this posts a plain object to the document that handed us the PoC and whose origin came off that very
    // message, so the only way it throws is a bug in that pairing — and swallowing it left the popup showing
    // "click Run PoC" for ever, which reads as a verify the user never started rather than as one that broke.
    (parentWin || parent).postMessage({ type: "POC_RAN", marker: marker, error: threw,
                                        ran: threw === null, handle: handle },
                                      parentOrigin);
  });

  // Tell the popup we're ready to receive the PoC.
  try { parent.postMessage({ type: "POC_READY" }, "*"); } catch (_) {}
})();
</script>
</body>
</html>
