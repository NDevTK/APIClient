<!doctype html><html><head><title>instrument control</title></head><body>
<script>
  // INSTRUMENT CONTROL, ENDPOINT HALF. The simplest things that must produce a fetchCallSite: one inline at
  // top level, one in a function nobody calls, one behind an absent-state flag, and two more in a
  // subresource (see ext.js).
  //
  // NOTHING THAT OPENS AN @S SEARCH BELONGS IN THIS DOCUMENT, and that is measured rather than tidy. The
  // security rungs live in security.html because they put four to six CANDIDATE flows on the frontier, each
  // of which re-runs the whole page, and `neverCalled` below needs the opposite: solver/engine.c seeds an
  // orphan drive only from the branch a flow reaches when it has run out of every other kind of work, and
  // takes ONE orphan per call, which then has to be picked and run before the dwell ends. The two halves in
  // one document are a RACE and this half loses it -- measured on one artifact, one dwell, two passes each:
  // these rungs alone report 6 endpoints twice with zero spread at flows=10, and with the security rungs
  // added the same document reported 6 then 5, with `/api/orphan-only` the one that comes and goes. A
  // control whose number moves for a reason that is not the thing it measures is not a control.
  fetch('/api/inline-top?k=1');
  function neverCalled(){ fetch('/api/orphan-only'); }
  if (window.__FLAGS && window.__FLAGS.admin) fetch('/api/admin-gated');
</script>
<script src="/ext.js"></script>
</body></html>
