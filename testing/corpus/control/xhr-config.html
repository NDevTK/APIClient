<!doctype html><html><head><title>instrument control — the same config through XMLHttpRequest</title></head><body>
<!--
  INSTRUMENT CONTROL, XHR HALF. One question, and it is loaded-config.html's asked of the OTHER interface:
  does a record XMLHttpRequest handed the bundle answer as the server-injected state it is — its held members
  carrying the bytes that were actually sent, and a gate over ANY of them forking, whether the payload holds
  the member or not?

  IT IS A SIXTH ORIGIN AND NOT A RUNG ON THE FIFTH, for serve.mjs's own reason: a row is isolated by ORIGIN,
  so an XHR arm sharing loaded-config.html's port would put these endpoints in that row's union and neither
  row would be measuring its own interface. It is a separate DOCUMENT rather than a second arm of that one for
  the same reason, and the two rows are then directly comparable: same payload, same four kinds of member,
  same gates — only the interface differs.

  WHY THE PAIR IS THE MEASUREMENT AND NEITHER ROW IS. `fetch()`'s Response and XMLHttpRequest are two doors
  onto ONE fact — a byte sequence the server at an address filled — and this control's job is to catch the two
  ways that goes wrong. A row that emits its concrete address and none of its gated ones is a door that handed
  the bundle a PLAIN record: every member of it, held or not, answered concretely, and the whole logged-in
  surface behind those gates was never reached. TWO rows disagreeing is the other failure and it is the one a
  single row cannot see: one door carrying provenance and the other not is one capability wearing two names,
  and it reads as an ordinary difference in what two documents happened to learn.

  THE TWO ARMS INSIDE THIS DOCUMENT ARE THE SAME RELATION ONE LEVEL DOWN. §3.6.9 The response getter's `json`
  arm and §3.6.10 The responseText getter are two members over one reply's bytes, and §3.6.10 refuses a
  responseType that is not '' or 'text' — so they cannot be two reads of one object and are two objects over
  one address. A run in which the record forks and the string does not is that second member having been left
  out, which is exactly how a channel goes half-covered without anything reading zero.

  AND THE RECORD IS ASKED TO ENUMERATE ITSELF, the same four spellings the other three channels are asked and
  for the reason injected-state.html states: the reads above all name a member, so they only ever exercise the
  channel's answer about a name the PAGE supplied. `Object.keys`, `for..in`, the object spread and
  `Object.assign` supply none and ask for the record's own key list — ECMAScript §10.1.11 [[OwnPropertyKeys]]
  ( ) — and a channel that answers the empty list there runs the page's own loop zero times while every rung
  above still passes. The list and the count ride IN the address, so an empty answer (`/api/xhr-keys-`,
  `/api/xhr-in-0`) is an emitted fact and not the silence of a rung that was never reached.

  WHAT THIS DOCUMENT MUST PRODUCE — FLOORS, never equalities, and named so a miss is attributable:
      /api/us-east-1/xhr-value       the HELD member, as the bytes the server actually sent
      /api/{…region}/xhr-value       the same call site's SHAPE, carrying the reply's own provenance
      /api/xhr-admin                 a member HELD as `false`, gate forked
      /api/xhr-beta                  the same, one record deeper
      /api/xhr-user                  a member the payload does NOT hold, gate forked
      /api/xhr-text-admin            the STRING arm: §3.6.10's bytes gated on, and the gate forked
      /api/xhr-keys-region-tier-admin-nested    the record's own key list, through §20.1.2.19 Object.keys
      /api/xhr-in-4                             the same list, through §14.7.5.9's for-in
      /api/xhr-assign-region-tier-admin-nested  the same list, through §20.1.2.1 Object.assign
      /api/xhr-spread-region-tier-admin-nested  the same list, through §7.3.25's object spread
      runOutcomesMine {complete:1}
  THE FIRST FLOOR ALONE READS AS A PASS AND IS THE DEFECT THIS ROW EXISTS FOR: a run that emits the concrete
  address and none of the four gated ones is a run in which this interface's two content members handed the
  bundle plain values, so every gate over one took a single arm and four endpoints were never learned.
-->
<script src="/xhr-cfg.js"></script>
</body></html>
