<!doctype html><html><head><title>instrument control — request METHOD</title></head><body>
<script>
  // Instrument control, the request method axis (Fetch §2.2.1 "Methods"). Every address is a string literal
  // except the one rung that reads a reply. It is its own document because a regression here has been an
  // engine abort, which blinds every column of the document it happens in (serve.mjs).
  //
  // Rung 1, the in-document positive control: an inline top-level GET, issued first.
  fetch('/api/method-get');
  // Rung 2, the page's own non-GET on its unforced run: the egress default sends it as the page composed it
  // (method, its own header, its body), and the page reads the reply. The address of the GET that follows is
  // computed from the reply's `ok` member, so it exists only where the POST was answered.
  fetch('/api/method-post', { method: 'POST',
                              headers: { 'content-type': 'application/json', 'x-control': 'method-park' },
                              body: '{"a":1}' })
    .then(function (r) { return r.json(); })
    .then(function (j) { fetch('/api/method-post-read?ok=' + j.ok); });
  // Rung 3, a non-GET on a forced path: `__FLAGS` is absent, so only an arm that takes it as present reaches
  // this request. It is recorded with everything computed about it and is not sent.
  if (window.__FLAGS && window.__FLAGS.admin)
    fetch('/api/method-forced', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{"b":2}' });

  // What a run must produce (floors, never equalities), read from the shipped path and from serve.mjs's log:
  //   run: complete, with no abort.
  //   The surface names all four addresses: GET /api/method-get, POST /api/method-post,
  //   GET /api/method-post-read?ok=true and POST /api/method-forced.
  //   The instance's fired-send list (`egressSends`) holds POST /api/method-post as `sent`, admitted by the
  //   default arm for the page's own unforced run, and POST /api/method-forced as `not-sent` with the refusal
  //   `provenance=forced`; the run row's `egressDeclined` counts `blocked-signal:provenance=forced`.
  //   serve.mjs's log: real Chrome runs this page too and a send speaks as its document, so the two clients'
  //   lines are read as a count, in arrival order (Chrome's page first, then the zone's run of it). Two lines
  //   of `POST /api/method-post … x-control=method-park body={"a":1}`, two of `GET /api/method-post-read`,
  //   and no line for `/api/method-forced`, which neither client sends.
  // How a regression shows: one `POST /api/method-post` line instead of two (the page's own non-GET was
  // declined), or any `/api/method-forced` line (a forced path's request left).
</script>
</body></html>
