        <style>
            @keyframes fadeIn {
                0% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }
            @keyframes fadeOut {
                0% {
                    opacity: 1;
                }
                100% {
                    opacity: 0;
                }
            }
            #loading {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                top: 0;
                overflow: hidden;
                pointer-events: none;
                height: 100%;
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                /* This ensures that the Desktop application is still draggable while we show the loading screen.
                   In electron we use a custom toolbar and we control the draggable area through a React components
                   but as that isn't rendered yet this ensures the window is still draggable until then.
                */
                /* TODO(mads): This break the desktop app as it steals all clicks The fix is add display:none; to the
                   loading element but I'll do that in a follow-up PR and then add the dragging back
 *              */
                /* -webkit-app-region: drag; */
            }
            body.loaded #loading {
                transition: opacity 0.4s ease-out;
                animation: fadeOut 0.4s ease-out;
                opacity: 0;
            }
            #loading-content {
                width: 45px;
                height: 46px;
                transition: opacity 0.4s ease-out;
                /* We delay the animation by 1s to ensure we only show the loading screen
                   if it takes more than 1s to load the assets and render the React application */
                animation: fadeIn 0.4s ease-out 1s both;
            }
            /* Match Ona theme surfaces before Tailwind loads.
               The background mirrors dark --surface-primary, while the dark theme-color
               meta mirrors --surface-base. Keep these with the mirrored tokens in index.css. */
            .dark body,
            .dark #loading {
                background-color: #161515;
                color: #fafafa;
            }
            .dark #loading-logo {
                filter: invert(1);
            }
        </style>

        <script nonce="" type="text/javascript">
            // This ensures that we use the correct theme for the loading screen.
            //
            // Currently it is the React application that is responsible for setting the theme class on the <html> element
            // but the whole purpose of this screen is to have have something to show the user while we're waiting for the
            // assets to load and and the initial React render.
            //
            // By setting the class here (too) we avoid having a white screen for the initial load which would result in a
            // flickering experience for the user.
            try {
                let e = localStorage.getItem("gitpod-ui-theme"),
                    t = window.matchMedia("(prefers-color-scheme: dark)").matches,
                    isDark = e === "dark" || (e !== "light" && t);
                if (isDark) {
                    self.document.documentElement.classList.add("dark");
                }
                // Set color-scheme so the browser uses the correct native background
                // color (scrollbars, form controls, default page background) before
                // CSS loads. Without this, dark-mode users see a white flash.
                let m = document.querySelector("meta[name='color-scheme']");
                if (m) m.setAttribute("content", isDark ? "dark" : "light");
            } catch (e) {}
        </script>
