<!doctype html><html><head><meta charset="utf-8"><title>date opaque</title></head>
<body><div id="app">date</div>
<script>
// Argless `new Date()` reads the current clock — a nondeterministic source, the
// same class as Date.now()/Math.random()/performance.now(). Forced exec must
// treat its coercions (+new Date(), .getTime(), .valueOf()) as SYNTH-opaque so a
// derived ?ts param is a DYNAMIC shape, never a baked per-request timestamp
// (?ts=1780170627094 would be a wrong, stale example value). A FIXED-arg Date is
// deterministic and MUST stay concrete (a legit example value). All three calls
// are cold orphans — never fired on load; forced exec drives them.
function sendArgless() {
  var t = +new Date();                 // argless coercion → SYNTH-opaque
  fetch("/api/argless?ts=" + t);       // expect ts = opaque/dynamic shape
}
function sendGetTime() {
  var t = new Date().getTime();        // argless .getTime() → SYNTH-opaque
  fetch("/api/gettime?ts=" + t);       // expect ts = opaque/dynamic shape
}
function sendFixed() {
  var t = +new Date(2020, 0, 1);       // fixed-arg → concrete 1577836800000
  fetch("/api/fixed?ts=" + t);         // expect ts = concrete value
}
window.__dateOrphans = { argless: sendArgless, getTime: sendGetTime, fixed: sendFixed };
</script>
</body></html>
