<!doctype html><html><head><meta charset="utf-8"><title>chain_min</title></head>
<body><div id="root">chain_min</div>
<!-- DIAGNOSTIC minimal repro (not a usefulness claim): the canonical
     reply->request chain in its simplest form. fetch a config, read a field of
     the JSON reply, fetch THAT. If forced exec connects it, the 2nd fetch's URL
     term carries fetch.body.* (fromReply true). Isolates whether the oidc gap is
     fundamental (chains never connect) or oidc-specific complexity. -->
<script>
globalThis.__chain = function () {
  return fetch("/chain_config.json")              // a REAL served JSON reply (static)
    .then(function (r) { return r.json(); })
    .then(function (cfg) { return fetch(cfg.dataUrl); }); // dataUrl is a reply field
};
</script>
</body></html>
