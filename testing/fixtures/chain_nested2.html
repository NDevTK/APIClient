<!doctype html><html><head><meta charset="utf-8"><title>chain_nested2</title></head>
<body><div id="root">chain_nested2</div>
<!-- DIAGNOSTIC: receiver-map maps class methods (chain_direct proved it). Now
     isolate the reply-through-nested-method step. runData: a nested method call
     returning DATA -> fetch (should connect if nested calls work). runReply: a
     nested method call returning a fetch REPLY -> fetch(reply.field) (the
     chain_nested case). If runData connects but runReply doesn't, the gap is the
     fetch-reply propagating out of a nested method call. -->
<script>
class Helper {
  getUrl() { return "/api/nested-data"; }                                       // returns DATA
  async getConfig() { var r = await fetch("/chain_config.json"); var j = await r.json(); return j; } // awaits then returns (vs return r.json())
}
class Client {
  constructor() { this._h = new Helper(); this.cfg = { url: "/api/runreply-direct" }; }
  runData() { return fetch(this._h.getUrl()); }                                 // nested call -> data -> fetch
  async runReply() {
    fetch(this.cfg.url);                                                        // DIRECT this-member: does runReply get real this?
    var c = await this._h.getConfig(); return fetch(c.dataUrl);                 // nested async this-method -> reply -> fetch
  }
}
var c = new Client();
globalThis.__data = function () { return c.runData(); };
globalThis.__reply = function () { return c.runReply(); };
</script>
</body></html>
