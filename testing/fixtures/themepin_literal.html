<!DOCTYPE html>
<html><head><title>themepin literal</title>
<style>
html { background-color: #00ff00; }
html[data-theme=dark]  { background-color: #101011; }
html[data-theme=light] { background-color: #f9fafb; }
#sw { width: 400px; height: 200px; background-color: #00ff00; }
html[data-theme=dark]  #sw { background-color: #101011; }
html[data-theme=light] #sw { background-color: #f9fafb; }
</style></head>
<body><div id="sw">themepin literal</div>
<script>
/* NO UNKNOWN ANYWHERE. This is the ARM THAT MUST ALREADY WORK, and it is the control that arms
   the other two: if this run's raster is #00ff00 rather than #101011, the cascade does not re-run
   over an attribute selector after setAttribute AT ALL, and every zero the other two fixtures
   report is a statement about that and not about a pin. */
document.documentElement.setAttribute('data-theme', 'dark');
</script>
</body></html>
