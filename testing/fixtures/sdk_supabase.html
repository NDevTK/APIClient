<!doctype html><html><head><meta charset="utf-8"><title>sdk_supabase</title></head>
<body><div id="root">sdk_supabase</div>
<!-- Real backend SDK, UNMODIFIED from its CDN (never inlined). The auth + DB REST
     call code ships to every logged-out visitor — THE MOAT. Handlers are gated
     (registered, not fired on load); forced exec must drive them to surface the
     auth-gated REST endpoints WITH per-param keys/values, WITHOUT a session. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var client = supabase.createClient("https://demo.supabase.co", "anon-public-key");
// Realistic gated handlers: a real app AWAITS the query builder (a lazy thenable
// whose fetch fires on .then()), unlike the eager signInWithPassword. Forced exec
// must drive the async await to surface the PostgREST DB endpoints.
globalThis.__loadProfiles = async function () {
  var r = await client.from("profiles").select("id,name,email");  // → GET /rest/v1/profiles?select=id,name,email
  return r.data;
};
globalThis.__insertPost = async function (title) {
  var r = await client.from("posts").insert({ title: title });    // → POST /rest/v1/posts
  return r.data;
};
globalThis.__login = function (email, pw) {
  return client.auth.signInWithPassword({ email: email, password: pw }); // eager → POST /auth/v1/token
};
</script>
</body></html>
