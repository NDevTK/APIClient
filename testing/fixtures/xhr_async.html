<!doctype html><html><head><meta charset="utf-8"><title>async xhr minimal</title></head>
<body><div id="app"></div>
<script>
// Minimal: XHR inside a Promise executor (the Algolia/async-SDK shape). xhr.open
// is a host edge that should record POST /api/thing even if the Promise never
// resolves. Does forced exec enter the executor + record, or hang/skip?
function go(){
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://demo.ex.net/api/thing');
    xhr.onload = function(){ resolve(xhr.responseText); };
    xhr.send('{"k":"v"}');
  });
}
window.__x = { go: go };
</script>
</body></html>
