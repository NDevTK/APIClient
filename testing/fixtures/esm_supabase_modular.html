<!doctype html><html><head><meta charset="utf-8"><title>esm_supabase_modular</title></head>
<body><div id="root">esm_supabase_modular</div>
<!-- REAL modular ESM library from a CDN (esm.sh serves @supabase/supabase-js as ESM
     that imports its own sub-packages by URL — exercises multi-level transitive ESM
     resolution on a real lib). If this learns /auth/v1/token [email,password] like the
     UMD sdk_supabase did, the ESM-from-CDN capability is validated on a real library. -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const sb = createClient("https://demo.supabase.co", "demo-anon-key");
globalThis.__login = function (e, p) { return sb.auth.signInWithPassword({ email: e, password: p }); };
globalThis.__signup = function (e, p) { return sb.auth.signUp({ email: e, password: p }); };
</script>
</body></html>
