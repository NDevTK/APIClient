<script>
// github netdiff: 28 reached-but-opaque fetches whose URL/method is
// "[object Object]" — the route-descriptor shape fetch(`/${route.owner}/...`).
// One COLD probe fires all four cells with the SAME opaque arg so a single
// forced-exec drive exercises every cell deterministically (per-function cold
// driving was nondeterministic). The 2x2:
//   axis 1: + concat   vs  template literal
//   axis 2: DIRECT opaque arg  vs  MEMBER access (arg.repo)
// STATE (after the fetch-edge !ISOPQANY method fix): cd/cm/tm learn
// /cell/{hole}/info GREEN — the method opacity (input.method read off the
// opaque url) was the blocker, and clearing it also unblocked the member-url
// holes. The ENGINE handles ALL four shapes correctly, including template +
// bare-opaque arg `${x}` — PROVEN by the isolated fixture tdmin.html (learns
// GET /tdmin/{arg0}/info clean; strconcat_diag showed the arg IS opaque at
// .concat and js_string_concat:49916 builds the concat term). In THIS 4-fetch
// probe td can appear reached-but-opaque, but that is a multi-fetch RECORDING
// artifact (strconcat is always opaque here too), NOT an engine gap — do not
// treat it as a real "[object Object]" bug.
function probe(x) {
  fetch("/cd/" + x + "/info");        // concat, direct  → known-good control
  fetch(`/td/${x}/info`);            // templ,  direct
  fetch("/cm/" + x.repo + "/info");   // concat, member
  fetch(`/tm/${x.repo}/info`);       // templ,  member
}
window.__om = { probe: probe };
</script>
