<!doctype html>
<html><head><meta charset="utf-8"><title>hashsite</title></head>
<body>
<!-- The live case for an address PoC with no attacker site configured (testing/harness.js attacker-case
     <url> address unset): the fragment is written into markup, so the delivery needs no particular attacker
     origin and the constant launcher opens it. -->
<div id="out"></div>
<script>
document.getElementById("out").innerHTML = decodeURIComponent(location.hash.slice(1));
</script>
</body></html>
