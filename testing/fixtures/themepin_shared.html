<!DOCTYPE html>
<html><head><title>themepin shared</title>
<style>
html { background-color: #00ff00; }
html[data-theme=dark]  { background-color: #101011; }
html[data-theme=light] { background-color: #f9fafb; }
#sw { width: 400px; height: 200px; background-color: #00ff00; }
html[data-theme=dark]  #sw { background-color: #101011; }
html[data-theme=light] #sw { background-color: #f9fafb; }
</style></head>
<body><div id="sw">themepin shared</div>
<script>
/* ONE READ, SHARED. Identical to `themepin_pinned` except that `parsed.theme` is read ONCE into a
   variable and BOTH the store and the equality use that ONE value. Its sibling reads the property
   TWICE, so the store holds read #1 and the equality pins read #2 — two values denoting one unknown.
   The pin is asked OF THE VALUE (`concolic_pin_bytes(taint)`), deliberately, because a key spelled
   from `src` would hand a derivation its operand's bytes. So this fixture is the DISCRIMINATOR
   between two readings of its sibling's abort: if this one paints two worlds that differ and the
   sibling does not, a pin is not reaching a second value that denotes the same unknown, and the
   mechanism works only where a page happens to reuse a variable. If this one aborts too, the
   defect is elsewhere and the read-count is not it. */
var stored = localStorage.getItem('themepin_session');
if (stored) {
  var parsed = JSON.parse(stored);
  if (parsed && parsed.theme) {
    var t = parsed.theme;
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'dark') { window.__themepin = 1; }
    else if (t === 'light') { window.__themepin = 2; }
  }
}
</script>
</body></html>
