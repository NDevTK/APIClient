<!doctype html><html><head><meta charset="utf-8"><title>branchless cold method</title></head>
<body><div id="app"></div>
<script>
// appwrite's shape: service methods call a shared this.client.call(verb, literal-path).
// Two COLD (never-called) methods — one BRANCHLESS, one with a branch. The moat
// should learn BOTH via cold-orphan driving. If only the branch one is learned,
// the value-spread's branch requirement is the gap (appwrite 5/82).
function makeClient(base) {
  return { call: function (m, p) { return fetch(base + p, { method: m }); } };
}
function Svc(client) { this.client = client; }
Svc.prototype.coldFlat = function () {
  return this.client.call('PATCH', '/svc/flat');                 // BRANCHLESS cold method
};
Svc.prototype.coldBranch = function (o) {
  if (o && o.k) { return this.client.call('POST', '/svc/branch_a'); }
  return this.client.call('GET', '/svc/branch_b');               // cold method WITH a branch
};
var svc = new Svc(makeClient('https://demo.ex.net'));
window.__s = { svc: svc };   // real instance exposed; methods NOT called (both cold)
</script>
</body></html>
