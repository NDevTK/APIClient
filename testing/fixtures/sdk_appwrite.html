<!doctype html><html><head><meta charset="utf-8"><title>sdk_appwrite</title></head>
<body><div id="root">sdk_appwrite</div>
<!-- Second real backend SDK (appwrite), UNMODIFIED from its CDN — confirm the
     moat generalizes to another vendor + surface any new URL/param gaps. The
     auth/DB/teams REST ships to every logged-out visitor; gated handlers drive
     the endpoints. -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@16"></script>
<script>
var client = new Appwrite.Client().setEndpoint("https://cloud.appwrite.io/v1").setProject("demo-proj");
var account = new Appwrite.Account(client);
var db = new Appwrite.Databases(client);
var teams = new Appwrite.Teams(client);
globalThis.__login = function (email, pw) {
  return account.createEmailPasswordSession(email, pw);   // POST /v1/account/sessions/email
};
globalThis.__me = function () {
  return account.get();                                   // GET /v1/account
};
globalThis.__listDocs = function () {
  return db.listDocuments("main", "posts");               // GET /v1/databases/main/collections/posts/documents
};
globalThis.__createTeam = function (name) {
  return teams.create("unique()", name);                  // POST /v1/teams
};
</script>
</body></html>
