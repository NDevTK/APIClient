<!doctype html><html><head><meta charset="utf-8"><title>chain_template</title></head>
<body><div id="root">chain_template</div>
<!-- A TEMPLATED reply chain (module-level, so NOT gated by the async this-method
     flaw): the 2nd fetch interpolates a reply field into a literal URL, so it's a
     TEMPLATED endpoint (/api/widgets with an {apiHost} hole, src=fetch.body), not
     a fully-opaque resolverError. The seed currently only handles resolverErrors;
     this checks whether the templated reply-derived hole is detected so the seed
     can be extended to fill it. -->
<script>
async function getConfig() { var r = await fetch("/chain_config.json"); return r.json(); }
async function load() {
  var c = await getConfig();
  return fetch(c.apiHost + "/api/widgets");   // {apiHost} from reply + literal path
}
globalThis.__load = function () { return load(); };
</script>
</body></html>
