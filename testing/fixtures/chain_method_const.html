<!doctype html><html><head><meta charset="utf-8"><title>chain_method_const</title></head>
<body><div id="root">chain_method_const</div>
<!-- Narrows the async-method-return gap: getConfig returns a CONCRETE object
     (no fetch reply). If run() fetches /api/const-method the async-method
     return DOES propagate for concrete values -> the gap is reply-PROVENANCE
     across the method boundary. If COLD the async-method return doesn't
     propagate at all. Clean-slate per run (cumulative storage confounds). -->
<script>
class Helper {
  async getConfig() { return { dataUrl: "/api/const-method" }; }
}
class Client {
  constructor() { this._h = new Helper(); }
  async run() { var c = await this._h.getConfig(); return fetch(c.dataUrl); }
}
var c = new Client();
globalThis.__run = function () { return c.run(); };
</script>
</body></html>
