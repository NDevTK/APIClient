<!doctype html><html><head><meta charset="utf-8"><title>oidc_search_nogate</title></head>
<body><div id="root">oidc_search_nogate</div>
<!-- Same as oidc_search_min but WITHOUT the `if(!code)return` gate: isolates
     whether the cold token POST is the location.search ?code gate (this CONNECTS
     -> gate is location.search) or the reply chain itself (this COLD -> chain). -->
<script>
async function discover() { var r = await fetch("/chain_config.json"); return r.json(); }
globalThis.__callback = async function () {
  var params = new URLSearchParams(location.search);
  var code = params.get("code");
  var cfg = await discover();
  return fetch(cfg.dataUrl, { method: "POST", body: JSON.stringify({ code: code }) });
};
</script>
</body></html>
