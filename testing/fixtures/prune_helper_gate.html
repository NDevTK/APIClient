<!doctype html><html><head><meta charset="utf-8"><title>prune helper gate</title></head>
<body><div id="app">x</div>
<script>
// The dominant minified shape that the FLAT host-reach prune under-covers: a shared
// fetch helper M, and a caller `pick` that chooses WHICH url to hand M based on an
// OPAQUE flag. `pick` has no fetch in its own bytecode (only an OP_call to M), so
// qjs_host_reach_check(pick)==0 → the prune concretizes its opaque `if(flag)` to the
// DEFAULT arm with no frontier, and the deep-grind backstop drives `pick` once down
// that same default arm — so the gated /api/admin/x arm is NEVER explored. Forced
// exec SHOULD learn BOTH /api/admin/x and /api/public/x. Cold orphans (inert on load).
function M(u){ return fetch(u, { headers: { "x-from": "helper" } }); }
function pick(flag){
  if (flag) return M("/api/admin/x");    // gated arm — lost while `pick` is pruned
  return M("/api/public/x");             // default arm — driven, learned
}
window.__pruneGate = { M: M, pick: pick };
</script>
</body></html>
