<!doctype html><html><head><meta charset="utf-8"><title>chain_direct_await</title></head>
<body><div id="root">chain_direct_await</div>
<!-- A DIRECT fetch BEFORE an await-gated reply chain, all MODULE-level (free
     fetch, no this-member -> NOT the provenance gap chain_nested2 hits). The
     direct fetch sets qjs_h_fired; under the OLD `!qjs_h_fired` directed-drive
     pump gate that STOPPED the pump before `await fetch(config)` resolved, so
     the chained fetch(c.dataUrl) went cold. The gateless full-drain pump fix
     drains the await -> r=reply -> c=r.json() -> fetch(c.dataUrl) is
     reply-derived -> the reply_example endpoint is learned. Isolates+proves the
     pump fix (cold without it, connects with it). Inert on load. -->
<script>
globalThis.__run = async function () {
  fetch("/api/direct-first");                  // fires first -> sets qjs_h_fired
  var r = await fetch("/chain_config.json");   // await-gated reply (gated pump skipped this)
  var c = await r.json();
  return fetch(c.dataUrl);                      // reply-derived -> reply_example
};
</script>
</body></html>
