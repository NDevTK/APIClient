<!doctype html><html><head><meta charset="utf-8"><title>chain_predread</title></head>
<body><div id="root">chain_predread</div>
<!-- Distinguishes the chain_nested2 cold cause: a method that reads this (so the
     precursor runs) with a NON-host-edge statement before the await-gated reply
     chain. If this CONNECTS, chain_nested2's cold is specifically the pre-await
     FETCH (host edge sets qjs_h_fired before the await resumes). If COLD, it's
     the statement/structure, not the host edge. -->
<script>
class Helper {
  async getConfig() { var r = await fetch("/chain_config.json"); var j = await r.json(); return j; }
}
class Client {
  constructor() { this._h = new Helper(); this.cfg = { url: "/api/predread" }; }
  async run() { var x = this.cfg.url; if (!x) return; var c = await this._h.getConfig(); return fetch(c.dataUrl); }
}
var c = new Client();
globalThis.__run = function () { return c.run(); };
</script>
</body></html>
