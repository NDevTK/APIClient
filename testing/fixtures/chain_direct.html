<!doctype html><html><head><meta charset="utf-8"><title>chain_direct</title></head>
<body><div id="root">chain_direct</div>
<!-- DIAGNOSTIC: does the receiver-map give a cold-driven CLASS METHOD its real
     `this` so a DIRECT this-member URL resolves concretely (NO reply chain)?
     Isolates whether the receiver-map maps class methods at all vs. failing only
     on the reply chain (chain_nested). If /api/direct-sync + /api/direct-async
     are learned, the receiver-map works for class methods and chain_nested's gap
     is the reply step; if not, it doesn't map THIS class's methods. -->
<script>
class Client {
  constructor() { this.cfg = { url: "/api/direct-sync" }; this.cfg2 = { url: "/api/direct-async" }; }
  runSync() { return fetch(this.cfg.url); }            // direct this-member, sync
  async runAsync() { return fetch(this.cfg2.url); }    // direct this-member, async
}
var c = new Client();
globalThis.__sync = function () { return c.runSync(); };
globalThis.__async = function () { return c.runAsync(); };
</script>
</body></html>
