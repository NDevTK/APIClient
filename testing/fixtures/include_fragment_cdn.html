<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>include-fragment (real CDN) — custom-element connectedCallback fetch</title>
</head>
<body>
  <h1>include-fragment custom element</h1>

  <!-- A REAL custom element from its REAL CDN (@github/include-fragment-element).
       On connect, its connectedCallback reads this.src and fetch()es it, then
       replaces itself with the response. Forced exec must DRIVE connectedCallback
       (executing the fetch), NOT read the src attribute statically. The moat
       question: is GET /api/fragment-load learned from EXECUTION? -->
  <include-fragment src="/api/fragment-load"></include-fragment>

  <!-- A SECOND, GATED instance: created by script only if a (forced) branch is
       taken. A logged-out visitor never triggers the branch, so a sniffer never
       sees /api/fragment-gated — it is the moat target (an UNUSED endpoint the
       bundle CAN reach). Inert on natural load: window.__loggedIn is undefined,
       so the real-load path does nothing; only forced multi-path execution
       drives the connectedCallback of the gated fragment. -->
  <div id="host"></div>
  <div id="host2"></div>
  <script>
    // UNCONDITIONAL programmatic create — isolates "does createElement +
    // appendChild fire connectedCallback under forced exec?" from branch
    // exploration. Fires on natural load too (so it's also captured live), but
    // forced exec must learn GET /api/fragment-prog from EXECUTING the lifecycle.
    (function () {
      var f = document.createElement("include-fragment");
      f.setAttribute("src", "/api/fragment-prog");
      document.getElementById("host2").appendChild(f);
    })();
  </script>
  <script>
    function mountGatedFragment() {
      var f = document.createElement("include-fragment");
      f.setAttribute("src", "/api/fragment-gated");
      document.getElementById("host").appendChild(f);
    }
    // Gated: only fires for a logged-in principal (never true on natural load).
    if (window.__loggedIn) {
      mountGatedFragment();
    }
  </script>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@github/include-fragment-element/+esm"></script>

  <!-- DISTINGUISHING PROBE: create the element AFTER define (whenDefined), so it
       is upgraded at createElement (not via the define-upgrade walk of a
       pre-existing node). If /api/fragment-when is learned but fragment-prog is
       not, the gap is define-upgrade-of-pre-existing; if neither, the lib's
       connectedCallback fetch isn't driven under forced exec (async-drain). -->
  <script>
    customElements.whenDefined("include-fragment").then(function () {
      var f = document.createElement("include-fragment");
      f.setAttribute("src", "/api/fragment-when");
      document.body.appendChild(f);
    });
  </script>
</body>
</html>
