     WHAT IS UNDER TEST. CSP §6.1.2 "connect-src": "The connect-src directive restricts the URLs which can be
     loaded using script interfaces", and "This directive controls requests which transmit or receive data
     from other origins". Under `connect-src 'none'` the `fetch()` below must never reach the network. The

     reports it to the endpoint specified in violation's policy, and fires a SecurityPolicyViolationEvent at

<!-- WITNESS: the document PARSED and the policy permits an image. Markup rather than script, so this one is
     true even if no script runs — which is what separates "never ran" from "ran and was refused". -->
<img src="/cspconn-blocked-parsed.png" alt="">

<script>
(function () {
  "use strict";
  new Image().src = "/cspconn-blocked-script-ran.png";

  /* CSP §5.5's event. Registered BEFORE the call it is about, or a synchronous refusal has nothing
     listening. The directive is read as a condition; the path it selects is a literal. */
  document.addEventListener("securitypolicyviolation", function (e) {
    new Image().src = "/cspconn-blocked-violation-any.png";
    if (e.effectiveDirective === "connect-src")
      new Image().src = "/cspconn-blocked-violation-connect.png";
  });

  /* THE SUBJECT, bracketed. A CSP refusal rejects the promise, it does not throw synchronously, so the
     rejection is caught rather than wrapped in try/catch — a `catch` block here would record nothing and
     read as the refusal not happening. */
  new Image().src = "/cspconn-blocked-fetch-called.png";
  fetch("/cspconn-blocked-connect.txt").then(function () {
    new Image().src = "/cspconn-blocked-connect-resolved.png";
  }, function () {
    new Image().src = "/cspconn-blocked-connect-rejected.png";
  });
})();
</script>
