<!doctype html><html><head><meta charset="utf-8"><title>algolia cdn</title></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/algoliasearch@4/dist/algoliasearch.umd.js"></script>
<script>
  // Search SDK from CDN — a different shape than a REST backend. Learn the
  // search/index/settings surface from the shipped client, logged out.
  var AS = (typeof algoliasearch !== 'undefined') ? algoliasearch : window.algoliasearch;
  var client = AS('DEMOAPPID', 'demoapikey');
  var index = client.initIndex('demo_index');
  window.__alg = {
    search:     function(){ return index.search('shoes', { hitsPerPage: 20, filters: 'price>10' }); },
    browse:     function(){ return index.browseObjects({ query: '' }); },
    save:       function(){ return index.saveObject({ objectID: '1', name: 'x' }); },
    partial:    function(){ return index.partialUpdateObject({ objectID: '1', name: 'y' }); },
    del:        function(){ return index.deleteObject('1'); },
    getSettings:function(){ return index.getSettings(); },
    setSettings:function(){ return index.setSettings({ searchableAttributes: ['name'] }); },
    multi:      function(){ return client.multipleQueries([{ indexName: 'demo_index', query: 'a' }]); },
    listIndices:function(){ return client.listIndices(); },
  };
</script>
</body></html>
