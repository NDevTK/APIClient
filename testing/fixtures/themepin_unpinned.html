<!DOCTYPE html>
<html><head><title>themepin unpinned</title>
<style>
html { background-color: #00ff00; }
html[data-theme=dark]  { background-color: #101011; }
html[data-theme=light] { background-color: #f9fafb; }
#sw { width: 400px; height: 200px; background-color: #00ff00; }
html[data-theme=dark]  #sw { background-color: #101011; }
html[data-theme=light] #sw { background-color: #f9fafb; }
</style></head>
<body><div id="sw">themepin unpinned</div>
<script>
/* THE ATTRIBUTE HOLDS AN UNKNOWN AND NOTHING EVER PINS IT. This is the POSITIVE CONTROL for the
   attribute-selector seam: `[data-theme=dark]` is being decided from a value this engine does not
   know, neither arm is contradicted, and deciding either one deletes a world nothing contradicted
   — so the seam must SPEAK here. A zero from this fixture is the seam failing to arm, which makes
   a zero from its pinned sibling unreadable. */
var stored = localStorage.getItem('themepin_session');
if (stored) {
  var parsed = JSON.parse(stored);
  if (parsed && parsed.theme) {
    document.documentElement.setAttribute('data-theme', parsed.theme);
  }
}
</script>
</body></html>
