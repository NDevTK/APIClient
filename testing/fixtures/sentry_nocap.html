<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sentry init, NO capture (cold-drive-of-send isolation)</title>
  <script src="https://browser.sentry-cdn.com/7.120.3/bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">x</div>
  <script>
    // Real @sentry/browser: init only, NO captureException/flush. The envelope
    // transport.send() is therefore NEVER triggered by the page — it is only
    // reachable via forced exec's COLD drive of the residue orphan. This is
    // gitlab's exact situation (a logged-out visitor triggers no error capture).
    // sentry_cdn.html (WITH captureException) learns POST /api/0/envelope/ via the
    // REAL fire; if THIS fixture does NOT, the gap is the cold-drive-capture of the
    // transport's send (its options/url closure not carried) — the gitlab gap.
    try { Sentry.init({ dsn: "https://examplePublicKey@o0.ingest.sentry.io/0" }); } catch (e) {}
    // A plain unrelated fetch so the page clearly analyzed (control).
    fetch("/api/ping", { headers: { "x-client": "web" } });
  </script>
</body>
</html>
