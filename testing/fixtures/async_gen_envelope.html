<!DOCTYPE html><html><head><meta charset="utf-8"><title>async-gen-envelope</title></head>
<body><div id="app">loading…</div>
<script>
// Replicates the Sentry SDK build whose envelope-item iteration is realized as an
// `async function*` consumed by `for await` — then makeRequest -> fetch() AFTER the
// loop (the gitlab _sentry_chunk.js shape: async function*×3, for-await/asyncIterator,
// forEachEnvelopeItem). The transport's send() is a COLD orphan: no error is captured
// on load, so it is never called concretely. Forced exec must DRIVE send() with an
// OPAQUE envelope; the `for await` over the async generator must drive its body once
// and reach the post-loop fetch with the CONCRETE url built inside — else the envelope
// endpoint (POST /api/77/envelope/) is never learned (the gitlab gap). Inert on load.
async function* eachEnvelopeItem(envelope) {
  var items = envelope[1];                 // envelope = [header, items]; opaque[1] = opaque
  for (var i = 0; i < items.length; i++) { // sync for-of yields one opaque element (bounded)
    yield items[i];
  }
}
async function transportSend(envelope) {
  var url = "/api/77/envelope/?sentry_key=abc123&sentry_version=7";   // built concrete (from a public dsn, like the real transport)
  var filtered = [];
  for await (var item of eachEnvelopeItem(envelope)) {   // <-- async-gen over opaque envelope
    filtered.push(item);
  }
  if (filtered.length === 0) return;                     // early-return guard (must NOT fire)
  fetch(url, { method: "POST", body: JSON.stringify(filtered) });   // DIRECT fetch (net=1) — reached only if the loop drove
}
// expose the transport as cold orphans (never invoked on load)
window.__agTransport = { send: transportSend, each: eachEnvelopeItem };
</script>
</body></html>
