     WHAT IS UNDER TEST, AND IT IS NOT A CONFORMANCE QUESTION ABOUT `fetch`. Fetch §5.6 "Fetch methods" resolves
     `fetch()`'s promise when the RESPONSE's head is available — "resolve p with a new Response object" — and
     §5.3 "Body mixin" makes reading the body a separate step, so a server that sends a complete head and then
     keeps writing is serving a perfectly ordinary response for as long as it likes. WPT's own
     `fetch/api/resources/infinite-slow-response.py` is that server, and `/infinite-slow-response` here is that
     handler by its own name. What this pair measures is whether THIS ENGINE GOES ON RUNNING while such a body
     is arriving: a page that asks for one has done nothing unusual, and every other flow in the document is
     owed the thread.

     THE ORACLE IS THE FIXTURE SERVER'S ACCESS LOG, which is evidence from OUTSIDE the engine: each witness
     requests one distinctive path, and the server logs every request line before it resolves a file. The
     witness paths do not exist on disk and answer 404 — the REQUEST is the record, not the reply.

     EVERY WITNESS PATH IS A CONSTANT, which is not a style choice. This engine's whole purpose is to make
     values unknown, and a request whose path was COMPUTED from an unknown is not a concrete string, so it is
     never sent — a witness built that way goes silent in exact proportion to how well the engine is working.

     THE SUBJECT IS AN ABSENCE, SO IT IS BRACKETED AT BOTH ENDS AND THE BRACKETS ARE TWO DIFFERENT QUESTIONS.
     `-parsed` is MARKUP, so it is true even if no script runs; `-script-ran` says the script reached its first
     statement; `-hold-called` fires immediately before the request whose body has no end; `-probe-called` fires
     immediately before a SECOND, ordinary request. Those four say the document did everything it was written to
     do. What the run is actually being asked is whether `-probe-resolved` appears, and it cannot appear unless
     the engine was STEPPED after the never-ending body began arriving: a reply has to be delivered to the
     frontier AND the flow parked on it has to be resumed to run that reaction.

     `-hold-resolved` IS A SEPARATE READING AND IS NOT THE SUBJECT. Fetch §5.6 resolves on the HEAD, so a
     browser fires it while the body is still coming; an engine whose door reads the whole body before it
     answers cannot fire it at all. So it is recorded and it is NOT what either verdict turns on — the two
     readings must not be reported as one.

     THIS ARM IS THE ARMED CONTROL AND IT IS THE REASON THE OTHER ARM'S ABSENCE IS A READING AT ALL. Its first
     request is ordinary and ends, so every step of the chain the other arm depends on — the document runs, the
     request is issued, a reply is delivered, the parked flow is resumed, the reaction runs, the witness reaches
     this server's log — is exercised here with nothing streaming anywhere. A run in which THIS arm's
     `-probe-resolved` is absent has established NOTHING WHATEVER about the other arm: the probe was never
     armed, which CLAUDE.md §A-CONTROL-ARMS-ONLY-ON-A-SITE is exactly about.
