<!doctype html><html><head><meta charset="utf-8"><title>oidc_discovery</title></head>
<body><div id="root">oidc_discovery</div>
<!-- Real library, UNMODIFIED from its CDN (never inlined): oidc-client-ts.
     THE reply->request chain: UserManager(authority) lazily GETs
     authority/.well-known/openid-configuration, then uses the REPLY's
     token_endpoint / authorization_endpoint / userinfo_endpoint as the URL of
     the NEXT request. signinCallback reads location.search (?code=) for the
     code exchange. Forced exec must drive signinRedirect/signinCallback (gated,
     not fired on load) to surface the chain — the token request URL is the
     discovery reply's field, genuinely opaque without the reply. -->
<script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3/dist/browser/oidc-client-ts.min.js"></script>
<script>
var mgr = new oidc.UserManager({
  authority: "https://demo.identityserver.io",
  client_id: "interactive.public",
  redirect_uri: "http://localhost:8765/oidc_discovery.html",
  response_type: "code",
  scope: "openid profile api"
});
globalThis.__login    = function () { return mgr.signinRedirect(); };   // discovery -> authorization_endpoint
globalThis.__callback = function () { return mgr.signinCallback(); };   // location.search ?code -> token_endpoint (reply chain)
globalThis.__user     = function () { return mgr.getUser().then(function (u) { return mgr.signinSilent(); }); };
</script>
</body></html>
