<!DOCTYPE html>
<html><head><title>themepin prepinned</title>
<style>
html { background-color: #00ff00; }
html[data-theme=dark]  { background-color: #101011; }
html[data-theme=light] { background-color: #f9fafb; }
#sw { width: 400px; height: 200px; background-color: #00ff00; }
html[data-theme=dark]  #sw { background-color: #101011; }
html[data-theme=light] #sw { background-color: #f9fafb; }
</style></head>
<body><div id="sw">themepin prepinned</div>
<script>
/* THE PIN BEFORE THE STORE. One read shared, as in `themepin_shared`, but the equality that pins runs
   BEFORE `setAttribute` rather than after. This is the ORDER AXIS on its own: the pin read at the
   cascade is documented as belonging at a READ rather than at a fork precisely so that order should
   not matter, since the cascade asks long after both statements have run. A difference between this
   fixture and `themepin_shared` would say the determination is not surviving the store — that
   `setAttribute` files something other than the value it was handed — which is a different diff from
   a pin that never reaches a second value. No real page is obliged to write it this way; this arm
   exists to separate two causes, not to model a document. */
var stored = localStorage.getItem('themepin_session');
if (stored) {
  var parsed = JSON.parse(stored);
  if (parsed && parsed.theme) {
    var t = parsed.theme;
    if (t === 'dark') { window.__themepin = 1; }
    else if (t === 'light') { window.__themepin = 2; }
    document.documentElement.setAttribute('data-theme', t);
  }
}
</script>
</body></html>
