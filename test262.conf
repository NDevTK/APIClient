[config]
# general settings for test262 ES6 version

# handle tests tagged as [noStrict]: yes, no, skip
nostrict=yes

# handle tests tagged as [strictOnly]: yes, no, skip
strict=yes

# test mode: default, default-nostrict, default-strict, strict, nostrict, both, all
#
# `all` BECAUSE THE SUITE ITSELF SAYS SO, AND `default` WAS HALF A RUN REPORTING A WHOLE NUMBER. test262's own
# INTERPRETING.md "Strict Mode" states it as a MUST: "Unless configured otherwise (via the `noStrict`,
# `onlyStrict`, `module`, or `raw` flags), each test must be executed twice: once in ECMAScript's non-strict
# mode, and again in ECMAScript's strict mode." `default` is run-test262's TEST_DEFAULT_NOSTRICT — its own
# comment reads "run tests as nostrict unless test is flagged as strictonly" — so every file carrying NONE of
# those four flags was executed SLOPPY ONLY and its strict execution simply never happened.
#
# THE REASON IT SURVIVED IS THAT NOTHING WAS MISSING FROM ANY LIST. The excluded-test defect normally shows up
# as a file nobody collected, and the summary's NOT-RUN line is built to report exactly that: conf exclusions
# and feature skips. Here every file WAS collected, run once, and counted as a test — so there was no list for
# the missing half to be absent from, and no number for it to be missing from either. A run that performs half
# the executions its oracle demands while reporting the file count is the same lie one granularity down, and it
# is the harder one to see, because the total looks complete.
#
# IT IS ALSO THE HALF THIS FORK MOST NEEDS. Strict and sloppy are DIFFERENT BYTECODE — different scoping, a
# different `this`, poisoned `arguments`/`caller`, different assignment and `delete` errors — so the forced
# time-travel feature had never been driven through a strict-mode body for any test not flagged onlyStrict, and
# the engagement percentage could not say so: it is a ratio over the back-edges that DID execute, so a body
# nothing ever entered contributes to neither side of it and reads as 100%.
#
# HOW TO CHECK THIS LINE IS IN EFFECT, without trusting this comment: run-test262 increments test_count per
# EXECUTION, not per file, so the denominator of `Result: N/M errors` is the measurement. Under `default` that
# denominator is the collected FILE count; under `all` it rises by the number of collected files bearing none of
# the four flags — a large fraction of the corpus. A denominator that has not moved means this is not in force.
mode=all

# handle tests flagged as [async]: yes, no, skip
# for these, load 'harness/doneprintHandle.js' prior to test
# and expect `print('Test262:AsyncTestComplete')` to be called for
# successful termination
async=yes

# handle tests flagged as [module]: yes, no, skip
module=yes

# output error messages: yes, no
verbose=yes

# load harness files from this directory
harnessdir=test262/harness

# names of harness include files to skip
#harnessexclude=

# name of the error file for known errors
errorfile=test262_errors.txt

# exclude tests enumerated in this file (see also [exclude] section)
#excludefile=test262_exclude.txt

# enumerate tests from this directory
testdir=test262/test

[features]
# Standard language features and proposed extensions
# list the features that are included
# skipped features are tagged as such to avoid warnings
# Keep this list alpha-sorted (:sort i in vim)
#
# AN `=skip` IS A DECISION AND AN OMISSION IS AN ACCIDENT, AND THE SUMMARY USED TO READ THEM AS ONE NUMBER. A
# feature ABSENT from this list makes run-test262 print `unknown feature: X` and skip the file; a feature present
# with `=skip` skips it SILENTLY. Both land in the same "skipped" total, so that total alone cannot tell a
# proposal somebody deliberately declined from a name nobody got round to writing down — and the harness
# reported the whole of it as the second kind, in a line that said "skipped for unlisted features" while the
# unlisted count was zero. engine/test262.mjs now COUNTS the `unknown feature:` warnings and splits the two, so
# absence and zero stop reading alike. What this list owes in return is the other half of each decision: not
# just that a feature is skipped, but the thing whose arrival ends the skip.
#
# EVERY `=skip` BELOW IS ONE SHAPE — the engine has no implementation of that proposal AT ALL, so its tests fail
# on the first identifier they touch and would teach nobody anything. Each is retired by the ARRIVAL OF THE
# CAPABILITY it names: Temporal by a Temporal intrinsic; decorators by decorator syntax in the parser;
# import-defer and source-phase-imports (and source-phase-imports-module-source) by their module-loading forms;
# canonical-tz, intl-normative-optional, Intl-enumeration and every Intl.* entry by the ECMA-402 implementation
# the intl402 exclusion at the bottom of this file is also waiting on.
#
# NONE OF THEM CAN BE DISCOVERED STALE BY RUNNING THE GATE, which is the whole reason the retirement condition
# has to be written down. A stale exclusion does not fail — it stays quiet and withholds tests, so the check is
# a GREP OF THE ENGINE for the capability, not a run of the corpus, and the obligation falls on whoever lands
# the capability to delete the line here in the same diff.

